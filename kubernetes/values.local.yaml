# Reuse the existing API chart and separate GoodJob deployment.
global:
  environment: local
  enableKeyVaults: false
base: &application
  image: et-full-system-servers-api:latest
  imagePullPolicy: Never
  ingressHost: api.k8s.orb.local
  ingressClass: et-local
  ingressAnnotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  aadIdentityName: ""
